[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sticks"
version = "0.1.0"
description = "STICKS: ATT&CK Campaign Execution Framework"
authors = [
    {name = "STICKS Team", email = "sticks@example.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering",
    "Topic :: Security",
]

dependencies = [
    "pydantic==2.13.4",
    "pyyaml==6.0.3",
    "click==8.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
]

[project.scripts]
sticks-run = "runners.campaign_runner:main"

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "runners*",
    "executors*",
    "loaders*",
    "models*",
    "calibration*",
    "utils*",
    "compilers*",
    "contracts*",
    "concretization*",
    "evaluation*",
    "adapters*",
    "curation*",
    "validators*",
]

[tool.setuptools.package-data]
sticks = ["**/*.yml", "**/*.yaml", "**/*.json", "**/*.md"]

[tool.black]
line-length = 100
target-version = ['py311']

[tool.ruff]
target-version = "py311"

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
